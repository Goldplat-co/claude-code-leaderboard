<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파인주얼리 판매 인기 랭킹</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       background:#fafafa;color:#191919;padding:20px 20px 80px}
  .wrap{max-width:1120px;margin:0 auto}
  a{color:inherit}
  .nav{display:flex;gap:6px;margin-bottom:14px}
  .nav a{padding:7px 15px;border:1px solid #e4e4e4;background:#fff;border-radius:16px;
         font-size:13px;text-decoration:none;color:#555}
  .nav a.on{background:#191919;color:#fff;border-color:#191919}
  h1{font-size:21px;letter-spacing:-.4px}
  .sub{color:#888;font-size:12.5px;margin:4px 0 18px;line-height:1.6}
  .sub b{color:#191919}
  .bar{background:#fff;border:1px solid #ececec;border-radius:10px;padding:12px 14px;margin-bottom:16px}
  .frow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
  .frow:last-child{margin-bottom:0}
  .flab{font-size:11px;color:#aaa;width:44px;flex-shrink:0}
  button{padding:5px 11px;border:1px solid #e4e4e4;background:#fff;border-radius:13px;
         cursor:pointer;font-size:12px;color:#555;white-space:nowrap}
  button:hover{border-color:#bbb}
  button.on{background:#191919;color:#fff;border-color:#191919}
  select{padding:5px 9px;border:1px solid #e4e4e4;border-radius:8px;font-size:12px;background:#fff}
  .more{background:none;border:none;color:#888;font-size:12px;cursor:pointer;padding:6px 0 0;text-decoration:underline}
  #adv{display:none;margin-top:8px;padding-top:9px;border-top:1px solid #f0f0f0}
  #adv.open{display:block}
  .list{background:#fff;border:1px solid #ececec;border-radius:10px;overflow:hidden}
  .item{display:flex;align-items:center;gap:13px;padding:11px 15px;border-bottom:1px solid #f4f4f4}
  .item:last-child{border-bottom:none}
  .item:hover{background:#fcfcfc}
  .rk{width:40px;text-align:center;flex-shrink:0}
  .rk b{font-size:16px;font-weight:800;letter-spacing:-.5px}
  .rk .mv{font-size:9.5px;display:block;margin-top:1px}
  .up{color:#e0245e}.down{color:#3b82f6}.same{color:#ccc}
  .th{width:54px;height:54px;object-fit:cover;border-radius:6px;background:#f2f2f2;flex-shrink:0;cursor:zoom-in}
  .mid{flex:1;min-width:0}
  .nm{font-size:12.5px;line-height:1.3;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{font-size:11px;color:#999;display:flex;gap:7px;flex-wrap:wrap}
  .tag{background:#f4f4f4;border-radius:3px;padding:1px 5px;color:#777}
  .tag.brand{background:#eef2ff;color:#4338ca;cursor:pointer}
  .hot{background:#fff0f4;color:#e0245e;font-weight:600}
  .sc{width:180px;flex-shrink:0}
  .scnum{display:flex;align-items:baseline;gap:5px;margin-bottom:3px}
  .scnum b{font-size:16px;font-weight:800}
  .scnum span{font-size:10px;color:#aaa}
  .bars{display:flex;gap:2px;height:5px}
  .bseg{height:100%;border-radius:2px}
  .legend{font-size:9.5px;color:#aaa;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
  .pr{width:96px;text-align:right;font-size:12.5px;font-weight:700;flex-shrink:0}
  .foot{text-align:center;padding:18px}
  .foot button{padding:8px 22px}
  .empty{padding:60px;text-align:center;color:#aaa;font-size:13px}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.87);display:none;align-items:center;
      justify-content:center;z-index:99;padding:28px;cursor:zoom-out}
  .lb.open{display:flex}
  .lbin{max-width:min(90vw,820px);text-align:center;cursor:default}
  .lbin img{max-width:100%;max-height:76vh;border-radius:10px;background:#fff;display:block;margin:0 auto}
  .lbi{color:#fff;margin-top:13px;font-size:12px;line-height:1.6}
  .lbi .t{font-size:15px;font-weight:700;margin-bottom:5px}
  .lbi .g{color:#bbb;font-size:11.5px}
  .lbi .g b{color:#fff}
  .lbx{position:absolute;top:16px;right:24px;color:#fff;font-size:30px;cursor:pointer;line-height:1}
  @media(max-width:860px){.sc,.pr{display:none}}

  .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
  .pod{background:#fff;border:1px solid #ececec;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}
  .pod.p1{border-color:#d4af37;box-shadow:0 2px 14px rgba(212,175,55,.16)}
  .pod img{width:76px;height:76px;object-fit:cover;border-radius:8px;background:#f2f2f2;flex-shrink:0;cursor:zoom-in}
  .pod .medal{font-size:20px;line-height:1}
  .pod .pn{font-size:12px;line-height:1.35;height:33px;overflow:hidden;margin:5px 0 4px;color:#333}
  .pod .ps{font-size:19px;font-weight:800}
  .pod .pp{font-size:11.5px;color:#666}
  .stats{display:flex;gap:20px;flex-wrap:wrap;padding:11px 0 14px;border-bottom:1px solid #eee;margin-bottom:15px}
  .stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#888}
  @media(max-width:820px){.podium{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
  <div class="nav"><a href="index.html" class="on">상품 랭킹</a><a href="brands.html">브랜드</a></div>
  <h1>파인주얼리 판매 인기 랭킹</h1>
  <div class="sub" id="sub"></div>
  <div class="stats" id="stats"></div>
  <div class="podium" id="podium"></div>

  <div class="bar">
    <div class="frow"><span class="flab">날짜</span><select id="f-date"></select>
      <span class="flab" style="width:auto;margin-left:10px">정렬</span><span id="f-sort"></span></div>
    <div class="frow"><span class="flab">품목</span><span id="f-cat"></span></div>
    <div class="frow"><span class="flab">함량</span><span id="f-mat"></span></div>
    <div class="frow"><span class="flab">가격</span><span id="f-price"></span></div>
    <button class="more" id="toggle">필터 더보기 ▾</button>
    <div id="adv">
      <div class="frow"><span class="flab">출처</span><span id="f-mall"></span></div>
      <div class="frow"><span class="flab">브랜드</span><select id="f-brand"></select>
        <a href="brands.html" style="font-size:11px;color:#4338ca">브랜드 페이지에서 자세히 →</a></div>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="foot"><button id="more2">더 보기</button></div>
</div>

<div class="lb" id="lb">
  <span class="lbx" id="lbx">&times;</span>
  <div class="lbin" id="lbin" onclick="event.stopPropagation()"></div>
</div>
<script src="https://jewelry-market-radar.vercel.app/data.js"></script>
<script>
const CAT_KO={ring:"반지",necklace:"목걸이",earring:"귀걸이",bracelet:"팔찌",anklet:"발찌",set:"세트"};
const BANDS=[["~10만",0,1e5],["10~30만",1e5,3e5],["30~50만",3e5,5e5],["50~100만",5e5,1e6],["100만~",1e6,Infinity]];
// 소비자 지표만. 판매몰수·BEST순위는 공급자가 만든 숫자라 점수에서 제외했다.
const PARTS=[["review_count","리뷰","#e0245e"],["like_count","좋아요","#8b5cf6"],["view_count","조회","#94a3b8"]];

const DATES = RADAR.dates;
let curDate = DATES[DATES.length-1];

// 상품 정보는 한 벌만 있고, 날짜별로 달라지는 지표는 history에서 꺼내 덮어쓴다.
// 그 날짜에 없던 상품(신규 진입 전/이탈 후)은 목록에서 빠진다.
function snap(d){
  const H=RADAR.history[d], K=RADAR.keys;
  const prevDate=DATES[DATES.indexOf(d)-1];
  const P=prevDate?RADAR.history[prevDate]:null;
  const out=[];
  for(const p of RADAR.products){
    const key=p.source+"|"+p.product_no;
    const v=H[key];
    if(!v) continue;
    const o={...p};
    K.forEach((k,i)=>o[k]=v[i]);
    const before=P&&P[key]?P[key][0]:null;
    o.rank_move=(before&&o.overall_rank)?(before-o.overall_rank):null;
    out.push(o);
  }
  return out;
}

const money=n=>n?n.toLocaleString()+"원":"가격없음";
// 로컬에 받아둔 이미지를 우선 쓰되, 없으면(=웹 배포 환경) 쇼핑몰 원본으로 자동 전환한다.
// 맥에서 열 때와 Vercel에서 열 때가 서로 다른 경로를 쓰는데,
// 같은 data.js 하나로 두 환경을 모두 커버하려면 폴백이 필요하다.
const originUrl=p=>{
  if(!p.image_url) return "";
  return p.image_url.startsWith("//") ? "https:"+p.image_url : p.image_url;
};
const img=p=>p.image_local_path ? "../"+p.image_local_path : originUrl(p);
// onerror에 넣을 코드. 로컬 경로가 404면 원본으로 한 번만 바꿔 끼운다(무한 루프 방지).
const fallback=p=>{
  const u=originUrl(p);
  return u ? `onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${u}'}"` : "";
};
const inBand=(v,n)=>{const b=BANDS.find(x=>x[0]===n);return b&&v>=b[1]&&v<b[2]};
const esc=s=>(s||"").replace(/</g,"&lt;").replace(/"/g,"&quot;");

function bars(p){
  const parts=p.score_parts||{};
  const segs=PARTS.filter(([k])=>parts[k]!==undefined);
  if(!segs.length) return "";
  const total=segs.reduce((s,[k])=>s+parts[k],0)||1;
  return `<div class="bars">${segs.map(([k,,c])=>
    `<div class="bseg" style="background:${c};width:${parts[k]/total*100}%"></div>`).join("")}</div>
    <div class="legend">${segs.map(([k,l,c])=>
    `<span style="color:${c}">${l} ${Math.round(parts[k])}</span>`).join("")}</div>`;
}
function moveTag(p){
  if(p.rank_move==null) return `<span class="mv same">–</span>`;
  if(p.rank_move>0) return `<span class="mv up">▲${p.rank_move}</span>`;
  if(p.rank_move<0) return `<span class="mv down">▼${-p.rank_move}</span>`;
  return `<span class="mv same">–</span>`;
}
function itemRow(p,rank,brandClickable){
  const m=[];
  if(p.review_count!=null)m.push(`리뷰 ${p.review_count.toLocaleString()}`);
  if(p.view_count!=null)m.push(`조회 ${p.view_count.toLocaleString()}`);
  if(p.like_count!=null)m.push(`♥ ${p.like_count}`);
  if(p.seller_count!=null)m.push(`${p.seller_count}몰`);
  const b=p.brand||p.mall_name;
  return `<div class="item">
    <div class="rk"><b>${rank}</b>${moveTag(p)}</div>
    <img class="th" src="${img(p)}" loading="lazy" alt="" ${fallback(p)} onclick="openLb('${p.source}','${p.product_no}')">
    <div class="mid">
      <div class="nm">${esc(p.name)}</div>
      <div class="meta">
        <span class="tag brand" ${brandClickable?`onclick="goBrand('${esc(b)}')"`:""}>${esc(b)}</span>
        ${p.material?`<span class="tag">${p.material}</span>`:""}
        ${p.category?`<span class="tag">${CAT_KO[p.category]||p.category}</span>`:""}
        ${m.map(x=>`<span>${x}</span>`).join("")}
        ${p.recency_bonus>0?`<span class="tag hot">🔥 급상승</span>`:""}
      </div>
    </div>
    <div class="sc">
      ${p.scored?`<div class="scnum"><b>${p.popularity_score}</b><span>신뢰 ${p.confidence}%</span></div>${bars(p)}`
                :`<div class="scnum"><span>지표 없음 · 참조용</span></div>`}
    </div>
    <div class="pr">${money(p.price_sale)}</div>
  </div>`;
}
function openLb(source,pno){
  const p=snap(curDate).find(x=>x.source===source&&x.product_no===pno); if(!p)return;
  const g=[];
  if(p.review_count!=null)g.push(`리뷰 <b>${p.review_count.toLocaleString()}</b>`);
  if(p.view_count!=null)g.push(`조회 <b>${p.view_count.toLocaleString()}</b>`);
  if(p.like_count!=null)g.push(`좋아요 <b>${p.like_count}</b>`);
  if(p.seller_count!=null)g.push(`${p.seller_count}몰 취급`);
  if(p.weight_g)g.push(`${p.weight_g}g`);
  if(p.registered)g.push(`${p.registered} 등록`);
  document.getElementById("lbin").innerHTML=`
    <img src="${img(p)}" alt="" ${fallback(p)}>
    <div class="lbi">
      <div class="t">${esc(p.name)}</div>
      <div class="g">${p.scored?`<b>${p.popularity_score}점</b> · `:""}${money(p.price_sale)} ·
        ${esc(p.brand||p.mall_name)}${p.material?` · ${p.material}`:""}${p.category?` · ${CAT_KO[p.category]||p.category}`:""}</div>
      <div class="g" style="margin-top:3px">${g.join(" · ")||"소비자 지표 없음"}</div>
    </div>`;
  document.getElementById("lb").classList.add("open");
}
function initLb(){
  const lb=document.getElementById("lb");
  lb.onclick=()=>lb.classList.remove("open");
  document.getElementById("lbx").onclick=()=>lb.classList.remove("open");
  document.addEventListener("keydown",e=>{if(e.key==="Escape")lb.classList.remove("open")});
}
function dateOptions(){
  return DATES.map(d=>`<option value="${d}" ${d===curDate?"selected":""}>${d.slice(4,6)}/${d.slice(6,8)}</option>`).join("");
}


const state={cat:"all",mat:"all",price:"all",mall:"all",brand:"all",sort:"score"};
let shown=60;

// 필터 선택지는 '전체 데이터'에서 뽑는다.
// 채점된 것만으로 뽑으면 다나와의 브랜드 82개가 통째로 사라진다(실제로 있었던 버그).
const uniqAll=k=>[...new Set(snap(curDate).map(d=>d[k]).filter(Boolean))];

function mk(id,key,opts,defaultFirst){
  const w=document.getElementById(id);
  w.innerHTML=opts.map(([v,l],i)=>
    `<button data-v="${v}" class="${(defaultFirst? i===0 : v==="all")?"on":""}">${l}</button>`).join(" ");
  w.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    w.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); state[key]=b.dataset.v; shown=60; render();
  });
}

function build(){
  document.getElementById("f-date").innerHTML=dateOptions();
  document.getElementById("f-date").onchange=e=>{curDate=e.target.value;buildBrand();render()};
  mk("f-sort","sort",[["score","인기도"],["recency","급상승"],["review","리뷰순"],
                      ["view","조회순"],["price_high","가격↓"],["price_low","가격↑"]],true);
  mk("f-cat","cat",[["all","전체"],...uniqAll("category").map(c=>[c,CAT_KO[c]||c])]);
  mk("f-mat","mat",[["all","전체"],...uniqAll("material").sort().map(m=>[m,m])]);
  mk("f-price","price",[["all","전체"],...BANDS.map(b=>[b[0],b[0]])]);
  mk("f-mall","mall",[["all","전체"],...uniqAll("mall_name").map(m=>[m,m])]);
  buildBrand();
  document.getElementById("toggle").onclick=e=>{
    const a=document.getElementById("adv"); a.classList.toggle("open");
    e.target.textContent=a.classList.contains("open")?"필터 접기 ▴":"필터 더보기 ▾";
  };
  document.getElementById("more2").onclick=()=>{shown+=60;render()};
}

function buildBrand(){
  const bc={}; snap(curDate).forEach(p=>{const b=p.brand||p.mall_name; if(b)bc[b]=(bc[b]||0)+1});
  const sorted=Object.entries(bc).sort((a,b)=>b[1]-a[1]);
  const sel=document.getElementById("f-brand");
  sel.innerHTML=`<option value="all">전체 (브랜드 ${sorted.length}개)</option>`+
    sorted.map(([b,c])=>`<option value="${esc(b)}" ${state.brand===b?"selected":""}>${esc(b)} (${c})</option>`).join("");
  sel.onchange=e=>{state.brand=e.target.value;shown=60;render()};
}

function filtered(){
  let l=snap(curDate).filter(p=>p.scored).filter(p=>
    (state.cat==="all"||p.category===state.cat)&&
    (state.mat==="all"||p.material===state.mat)&&
    (state.price==="all"||inBand(p.price_sale||0,state.price))&&
    (state.mall==="all"||p.mall_name===state.mall)&&
    (state.brand==="all"||(p.brand||p.mall_name)===state.brand));
  const n=v=>v==null?-1:v;
  const cmp={score:(a,b)=>b.popularity_score-a.popularity_score,
             recency:(a,b)=>(b.recency_bonus||0)-(a.recency_bonus||0)||b.popularity_score-a.popularity_score,
             review:(a,b)=>n(b.review_count)-n(a.review_count),
             view:(a,b)=>n(b.view_count)-n(a.view_count),
             price_high:(a,b)=>n(b.price_sale)-n(a.price_sale),
             price_low:(a,b)=>n(a.price_sale)-n(b.price_sale)}[state.sort];
  return [...l].sort(cmp);
}

function render(){
  const list=filtered();
  const ref=snap(curDate).filter(p=>!p.scored).length;

  document.getElementById("sub").innerHTML=
    `점수 = <b>리뷰50 좋아요30 조회20</b> (+최근성 15) · <span style="color:#c00">소비자 지표만 사용</span>` +
    ` — 판매몰수·BEST순위는 공급자 신호라 제외 · 참조용 ${ref}개는 랭킹 제외`;

  const prices=list.map(p=>p.price_sale).filter(Boolean).sort((a,b)=>a-b);
  document.getElementById("stats").innerHTML=`
    <div class="stat"><b>${list.length.toLocaleString()}</b><span>랭킹 상품</span></div>
    <div class="stat"><b>${new Set(list.map(p=>p.brand||p.mall_name)).size}</b><span>브랜드</span></div>
    <div class="stat"><b>${new Set(list.map(p=>p.mall_name)).size}</b><span>쇼핑몰</span></div>
    <div class="stat"><b>${prices.length?prices[Math.floor(prices.length/2)].toLocaleString():0}원</b><span>가격 중앙값</span></div>
    <div class="stat"><b>${DATES.length}</b><span>누적 스냅샷</span></div>`;

  document.getElementById("podium").innerHTML=list.slice(0,3).map((p,i)=>`
    <div class="pod ${i===0?"p1":""}">
      <img src="${img(p)}" alt="" ${fallback(p)} onclick="openLb('${p.source}','${p.product_no}')">
      <div style="min-width:0">
        <span class="medal">${["🥇","🥈","🥉"][i]}</span>
        <div class="pn">${esc(p.name)}</div>
        <div class="ps">${p.popularity_score}<span style="font-size:11px;color:#aaa"> 점</span></div>
        <div class="pp">${money(p.price_sale)} · ${esc(p.brand||p.mall_name)}</div>
      </div>
    </div>`).join("");

  const rest=list.slice(3,shown);
  document.getElementById("list").innerHTML = rest.length
    ? rest.map((p,i)=>itemRow(p,i+4,true)).join("")
    : `<div class="empty">조건에 맞는 상품이 없습니다</div>`;
  const btn=document.getElementById("more2");
  btn.style.display=shown<list.length?"":"none";
  btn.textContent=`더 보기 (${(list.length-shown).toLocaleString()}개 남음)`;
}
function goBrand(b){ location.href="brands.html?brand="+encodeURIComponent(b); }

initLb(); build(); render();
</script></body></html>
